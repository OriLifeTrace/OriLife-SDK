<!doctype html>
<meta charset="utf-8">
<title>OriLife — tra một quả từ trình duyệt</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Trang này chứng minh một điều cụ thể: một tệp HTML tĩnh, mở bằng file:// hay đặt ở bất kỳ tên
  miền nào, gọi thẳng được API OriLife mà không cần máy chủ trung gian và không cần xin khai
  origin. Đó là hệ quả của việc CORS mở cho mọi origin.

  Dùng LỐI CÔNG KHAI nên không cần tài khoản: khách chụp một quả đang bày và tra ra nguồn gốc.
  Không có khoá nào trong tệp này — và đó là lý do đặt được nó ở bất cứ đâu.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         max-width: 46rem; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 1.4rem; letter-spacing: -.02em; }
  .hint { opacity: .75; font-size: .95rem; }
  input[type=file] { margin: 1.2rem 0; }
  #ket-qua { margin-top: 1.4rem; }
  .the { border: 1px solid rgba(128,128,128,.35); border-radius: .7rem;
         padding: .8rem 1rem; margin: .6rem 0; }
  .the img { max-width: 100%; border-radius: .4rem; display: block; margin-top: .5rem; }
  .loi { color: #b00020; }
  @media (prefers-color-scheme: dark) { .loi { color: #ff8a80; } }
</style>

<h1>Quả này từ đâu ra?</h1>
<p class="hint">Chọn một tấm ảnh quả. Không cần đăng nhập — đây là lối công khai.</p>

<input type="file" id="anh" accept="image/*">
<div id="ket-qua"></div>

<script type="module">
  // Trong dự án thật: npm i @orilife/sdk rồi `import { Client } from '@orilife/sdk'`.
  // Ở đây trỏ thẳng vào mã nguồn trong kho này để mở tệp bằng file:// là chạy được ngay.
  import { Client } from '../javascript/src/index.js';

  const client = new Client();
  const hop = document.getElementById('ket-qua');
  const noi = (html) => { hop.innerHTML = html; };

  document.getElementById('anh').addEventListener('change', async (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    noi('<p class="hint">Đang tra…</p>');

    try {
      const out = await client.lookupFruit(file);

      // Ba dạng trả lời, và dạng đầu là dạng hay gặp nhất — bỏ sót nó thì trang trông như hỏng.
      // Khung có nhiều quả (hoặc không thấy quả nào) ⟹ máy chủ mời người dùng chỉ đúng quả rồi
      // gửi lại kèm bbox. `regions` LUÔN là danh sách, rỗng chứ không bao giờ null.
      if (out.need_region) {
        const n = (out.regions || []).length;
        noi(`<p>${out.message}</p><p class="hint">${n
          ? `Thấy ${n} quả trong khung — hãy chụp lại sao cho chỉ có một quả.`
          : 'Chưa thấy quả nào trong khung.'}</p>`);
        return;
      }

      const items = out.candidates || [];
      if (!items.length) {
        // "Không tìm thấy" là một KẾT QUẢ. Đừng hiện vòng xoay, đừng tự thử lại.
        noi(`<p>${out.message || 'Chưa gặp quả này trong tập công khai.'}</p>`);
        return;
      }

      noi(items.map((c) => {
        const tree = c.tree || {};
        return `
        <div class="the">
          <b>${c.name || 'quả chưa đặt tên'}</b>
          ${tree.code ? `<div class="hint">cây ${tree.name || ''} · ${tree.code}</div>` : ''}
          <div class="hint">đăng ký ${c.enrolled_at || '?'} · ${c.n_imgs || 0} ảnh</div>
          ${(c.img_urls || []).slice(0, 1).map((u) => `<img src="${u}" alt="">`).join('')}
        </div>`;
      }).join(''));
    } catch (e) {
      // `message` là câu máy chủ đã viết sẵn cho người đọc. Hiện thẳng câu đó — máy chủ biết ngữ
      // cảnh, trang này thì không.
      noi(`<p class="loi">${e.message}</p>`);
    }
  });
</script>
