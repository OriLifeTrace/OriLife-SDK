name: Tests

# Both suites check against the SAME vector set, generated from the code actually running on the
# server. Running both in one pass is deliberate: a bug only slips through if it shows up
# identically in both languages.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the floor promised in pyproject. A promise nobody runs is not a promise.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests/ -q
        working-directory: python

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/
        working-directory: javascript

  no-dependencies:
    # This package declares NO dependencies. That declaration needs a guard, because a stray
    # `import requests` would not turn any test red -- it would only stop this package from
    # running in the places it exists to run: an embedded device in a field, an agent's sandbox,
    # a serverless function with a size cap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python uses only the standard library
        run: |
          if grep -rnE '^\s*(import|from)\s+(requests|httpx|aiohttp|numpy|pydantic)\b' python/orilife/; then
            echo "::error::Python package picked up an external dependency"; exit 1
          fi
      - name: JavaScript has no dependencies
        run: |
          python3 - <<'PY'
          import json
          pkg = json.load(open('javascript/package.json'))
          extra = {**pkg.get('dependencies', {}), **pkg.get('devDependencies', {})}
          if extra:
              raise SystemExit(f"::error::JavaScript package picked up dependencies: {sorted(extra)}")
          PY
