name: Tests

# Both implementations run the SAME cases (`contract/`): the same verification vectors, the same
# conformance cases. Running them together is deliberate — a bug only slips through if it appears
# IDENTICALLY in both languages.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is the floor promised in pyproject. A promise nobody runs is not a promise.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests/ -q
        working-directory: python

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test
        working-directory: javascript

  generated-code-is-current:
    # The client code is generated from `contract/methods.json` and COMMITTED. Changing the
    # contract and forgetting to regenerate raises no alarm — except this step. It runs offline and
    # always answers, so it is RED on drift, with no third state.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/generate.py --check

  no-dependencies:
    # This package declares NO dependencies. That claim needs a guard, because a stray
    # `import requests` turns no test red — it only stops the package from running in exactly the
    # places it exists for: an embedded device in a field, a sandboxed automated client, a
    # serverless function with a size cap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python uses the standard library only
        run: |
          if grep -rnE '^\s*(import|from)\s+(requests|httpx|aiohttp|numpy|pydantic)\b' python/orilife/; then
            echo "::error::Python package picked up an external dependency"; exit 1
          fi
      - name: JavaScript has no dependencies
        run: |
          python3 - <<'PY'
          import json
          pkg = json.load(open('javascript/package.json'))
          extra = {**pkg.get('dependencies', {}), **pkg.get('devDependencies', {})}
          if extra:
              raise SystemExit(f"::error::JavaScript package picked up dependencies: {sorted(extra)}")
          PY

  contract-matches-the-live-server:
    # A COMPLETELY different question from the step above: that one asks "does the code match the
    # contract" (offline), this one asks "does the contract match the running server" (network).
    #
    # THREE states, not two. Real drift is RED. When the specification cannot be fetched, leave a
    # warning that SAYS the gate did NOT run — never fall silent into green, because "I do not
    # know" said in the voice of "fine" is more dangerous than a wrong answer.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare contract/methods.json with /openapi.json
        run: |
          set +e
          python3 tools/check_server_drift.py
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            echo "MATCH"
          elif [ "$code" = "1" ]; then
            echo "::error::DRIFT — the contract declares an endpoint the server does not serve. See the log."
            exit 1
          else
            echo "::warning::UNMEASURABLE — /openapi.json could not be fetched. This gate did NOT run this time; do not read it as 'nothing drifted'."
            exit 1
          fi
