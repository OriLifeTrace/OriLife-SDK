[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orilife"
version = "1.0.0"
description = "Identify individual trees, fruit and animals from photographs — the official OriLife SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "OriLife" }]
keywords = ["traceability", "agriculture", "identification", "cardano", "provenance"]
# NO dependencies, and that is a decision rather than an omission: this package has to run on an
# embedded box in a field, inside an agent's sandbox, in a serverless function with a size cap. The
# standard library covers everything needed here.
dependencies = []

[project.urls]
Homepage = "https://api.orilife.io"
Documentation = "https://api.orilife.io/docs"
Source = "https://github.com/OriLifeTrace/OriLife-SDK"

[tool.setuptools.packages.find]
include = ["orilife*"]
