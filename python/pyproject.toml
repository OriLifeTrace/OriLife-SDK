[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orilife"
version = "1.0.0"
description = "Định danh cá thể cây, quả và con vật bằng ảnh — bộ công cụ chính thức của OriLife"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "OriLife" }]
keywords = ["traceability", "agriculture", "identification", "cardano", "provenance"]
# KHÔNG có dependencies, và đó là một quyết định chứ không phải thiếu sót: bộ này phải chạy được
# trong máy tính nhúng ngoài đồng, trong hộp cát của một tác tử, trong hàm không máy chủ có trần
# dung lượng. Thư viện chuẩn đủ làm mọi việc ở đây.
dependencies = []

[project.urls]
Homepage = "https://api.orilife.io"
Documentation = "https://api.orilife.io/docs"
Source = "https://github.com/OriLifeTrace/OriLife-SDK"

[tool.setuptools.packages.find]
include = ["orilife*"]
